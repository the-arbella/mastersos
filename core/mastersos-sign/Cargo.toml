[package]
name = "mastersos-sign"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mastersos-bundle = { path = "../mastersos-bundle" }
anyhow = "1"
base64.workspace = true
chrono.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
tokio.workspace = true
toml.workspace = true
# escrow-read opens the sealed recovery keys with the kit's age identity.
age.workspace = true
zeroize.workspace = true

[dev-dependencies]
mastersos-bundle = { path = "../mastersos-bundle", features = ["test-util"] }
axum.workspace = true
sea-orm.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# 钥匙文件的属主要是当前用户：getuid。
# fs: flock around the pin compare-and-write.
nix = { workspace = true, features = ["user", "fs"] }
