[workspace]
resolver = "2"
members = ["mastersos-mcp", "mastersos-bundle", "mastersos-agent", "mastersos-sign", "mastersos-installer"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# 设置包与签名
ring = "0.17"
sha2 = "0.10"
base64 = "0.23"
tar = "0.4"
# Diagnostics archives (tar.zst): the C libzstd built by zstd-sys; no legacy formats, no dictionaries.
zstd = { version = "0.13", default-features = false }
flate2 = "1"
toml = "0.8"
toml_edit = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The schools' escrow recipients (`[school].escrow_recipients`): X25519 only, ASCII armor for the
# sealed recovery keys; no plugins, no ssh recipients.
age = { version = "0.11", default-features = false, features = ["armor"] }
# The recovery kit (plan 6 §5.2): HKDF-SHA256 derivation, bech32m text form, wiped buffers.
# bech32 0.12 here; age still pulls in 0.9 for its own keys (same wire format).
hkdf = "0.12"
zeroize = "1"
bech32 = "0.12"
# 服务端
axum = "0.8"
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
similar = "2"
utoipa = "5"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# agent
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
tokio-util = "0.7"
# MQTT push (the server's doorbell publisher, the agent's subscriber): MQTT v5 over rustls with the
# system roots, the same rustls as reqwest.
# No crypto provider of its own (its default would add aws-lc-rs): the publisher hands it a rustls
# config with ring and the system roots.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
nix = { version = "0.29", features = ["signal"] }
# 逐级 openat 的受限写入（safefs）；只用它的安全 API（process 只为 geteuid/getegid；termios 给安装器与首次开机程序关回显读口令）
rustix = { version = "1", features = ["fs", "process", "time", "termios", "mount"] }
# The sign-in handoff reads and writes Chrome's cookie database (SQLite built in: no system library to match)
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
# MCP
rmcp = { version = "=3.9.0", features = ["server", "transport-io"] }
schemars = "1"
# 命令行（agent、mastersos-sign）
clap = { version = "4", features = ["derive"] }
# 测试
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
