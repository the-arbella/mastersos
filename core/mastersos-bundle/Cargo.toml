[package]
name = "mastersos-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2.workspace = true
tar.workspace = true
flate2.workspace = true
ring.workspace = true
age.workspace = true
hkdf.workspace = true
zeroize.workspace = true
bech32.workspace = true
utoipa = { workspace = true, optional = true }
schemars = { workspace = true, optional = true, features = ["chrono04"] }
# `[[device]].reset` 的 requested_at（RFC 3339）
chrono = { workspace = true, features = ["serde"] }

[features]
# 给服务端生成 OpenAPI 用：状态回报、lint 等类型带上 ToSchema；agent 不开。
openapi = ["dep:utoipa"]
# JSON Schema of the settings file (`spec::manifest_schema`): mastersos-server turns it on; the agent does not.
schema = ["dep:schemars"]
# 测试辅助（`testutil::FakePasskey`）：server、agent 等的测试在 dev-dependencies 里打开。
test-util = []

[dev-dependencies]
# The spec consistency tests (`spec.rs`) need the schema.
mastersos-bundle = { path = ".", features = ["schema"] }
