<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starting…</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d2a; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  p { margin: 0; opacity: .85; }
  .actions { display: flex; gap: 12px; }
  button { font: inherit; padding: 8px 20px; border-radius: 8px; border: 0; background: #fff; color: #1b1d2a; cursor: pointer; }
  button.exit { background: #c62828; color: #fff; }
  button:focus-visible { outline: 2px solid #d9653b; outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Starting…</h1>
  <p id="body" hidden></p>
  <div class="actions" id="actions" hidden>
    <button type="button" id="retry">Try again</button>
    <button type="button" id="exit" class="exit">Exit</button>
  </div>
</main>
<script src="start.js"></script>
</body>
</html>
