# /etc 的来源（Ruling 3）。mkosi.finalize 读它生成 tmpfiles：
#   未列出的 /etc 顶层项   → L：链接到 /usr/share/factory/etc/…，跟着镜像更新走（默认）
#   copy <路径>            → C：首次开机从 factory 拷一次，之后归这台机器
#   dir  <路径>            → d：真实目录，里面的子项再按同一规则逐个生成。已装好的机器上若还是旧镜像
#                            的链接，由 mastersos-etc-migrate.service 在 tmpfiles 之前删掉（tmpfiles 的 r
#                            对非空目录报错，Task 1 实测）
# 格式：每行「<kind> <绝对路径>」，# 开头为注释。dir 与 copy 的父目录必须是 dir 或 /etc
# （tests/check-tree.sh 检查）。agent 写入的每个目录都要落在 copy 或 dir 之下（Task 6 的测试核对）。
# lab profile 的附加行在 etc-policy.lab.conf。

# 账号与组：useradd / sysusers / authd 会改它们
copy /etc/passwd
copy /etc/group
copy /etc/shadow
copy /etc/gshadow
copy /etc/subuid
copy /etc/subgid
# 打印机队列、时区、主机名、GDM（登录界面设置）
copy /etc/cups
copy /etc/localtime
copy /etc/hostname
copy /etc/gdm3
# 语言（4b Task 17，VM 165 实测）：26.04 的 localed 写 /etc/locale.conf（同目录的临时文件再改名）；GDM 与 login 的
# pam_env 读 /etc/default/locale，它是 Debian 的相对链接 ../locale.conf——/etc/default 本身是指向 factory 的链接时，
# 它解析到 factory 里镜像的那份，学校设的语言进不了会话。所以 /etc/default 是真实目录（里面的项仍是链接，locale 照原样
# 指向 ../locale.conf，即 /etc/locale.conf），/etc/locale.conf 归这台机器
dir /etc/default
copy /etc/locale.conf
# The keymap (design 2026-11-01): localed writes /etc/X11/xorg.conf.d/00-keyboard.conf, and the login screen and the desktops read
# it back through localed (VM 121)
dir /etc/X11
dir /etc/X11/xorg.conf.d

# Wi‑Fi 与有线连接（agent 写 system-connections，0600）
dir /etc/NetworkManager
dir /etc/NetworkManager/system-connections
# Ubuntu 的 NetworkManager 存连接（nmcli、设置、快捷设置里连一张新网）时经 netplan 写 /etc/netplan/90-NM-<uuid>.yaml，
# 再由 netplan generate 生成 /run/NetworkManager/system-connections/ 下的连接；/etc/netplan 是指向只读 factory 的链接时
# NM 在 yaml_emitter_set_output_file 断言失败、整个进程 abort（4b Task 14 在 VM 165 上实测）
dir /etc/netplan
# Wi-Fi private keys of eap = "tls" networks: the agent writes /etc/mastersos/wifi/<uuid>/client-key.pem (0700 directory,
# 0600 file); the connection file holds only the path, since NetworkManager shows 802-1x.private-key to every user
dir /etc/mastersos
dir /etc/mastersos/wifi
# GNOME 的系统默认值与锁定（agent 写 dconf 数据库）。profile 在 /usr/share/dconf/profile（user → system-db:mastersos，
# gdm → system-db:gdm），keyfile 目录由 agent 写、dconf update 编成 db/mastersos 与 db/gdm（4b）
dir /etc/dconf
dir /etc/dconf/db
dir /etc/dconf/db/mastersos.d
dir /etc/dconf/db/mastersos.d/locks
dir /etc/dconf/db/gdm.d
# Chrome 企业策略
dir /etc/opt
dir /etc/opt/chrome
dir /etc/opt/chrome/policies
dir /etc/opt/chrome/policies/managed
# 本机管理员（local_users_admin，4b）
dir /etc/sudoers.d
# polkit 规则
dir /etc/polkit-1
dir /etc/polkit-1/rules.d
# 扫描仪：agent 把学校的 eSCL 扫描仪写进 /etc/sane.d/airscan.d/mastersos.conf（sane-airscan 读 airscan.conf 之后读这个目录）
dir /etc/sane.d
dir /etc/sane.d/airscan.d
# 更新通道覆盖（Ruling 5：选 beta 时 agent 写同名 transfer）
dir /etc/sysupdate.d
# authd's broker config (4b). oidc/broker.conf (skeleton) follows the image (L). With SSO configured the agent writes the
# school's identity system to oidc/broker.conf.d/10-mastersos.conf (0600) and copies the registration from
# /usr/lib/mastersos/authd/oidc-broker.conf to brokers.d/oidc.conf; without SSO it removes both, so the login screen lists no OIDC
dir /etc/authd
dir /etc/authd/brokers.d
dir /etc/authd/oidc
dir /etc/authd/oidc/broker.conf.d
# 锁定应用（计划 9 Task 5）：agent 写 pam_namespace 的 namespace.d/mastersos-kiosk.conf（kiosk 账号的名单），与每个 kiosk
# 账号的 user@<uid>.service.d/50-mastersos-kiosk.conf（user manager 停下就清理）。两处的其余子项照旧是指回 factory 的链接
dir /etc/security
dir /etc/security/namespace.d
dir /etc/systemd
dir /etc/systemd/system
