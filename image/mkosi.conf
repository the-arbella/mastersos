        language-pack-gnome-zh-hans
        language-pack-zh-hant
        language-pack-gnome-zh-hant
        xdg-desktop-portal-gnome
        # 文件选择框（上传、另存为）：GNOME 50 的 portal-gnome 把它交给 Nautilus，浏览器模式堵了 Nautilus 就没有了；
        # /usr/share/xdg-desktop-portal/ubuntu-portals.conf 让 FileChooser 走它（4b Task 13）
        xdg-desktop-portal-gtk
        pipewire-audio
        # GNOME 50 的 Ctrl+Alt+T 经它找终端（没有它桌面模式也打不开终端；浏览器模式下这个快捷键被清空、终端被堵）
        xdg-terminal-exec
        # 锁定应用（计划 9）：gnome-kiosk 是锁定会话的合成器（会话、gnome-session 的 target drop-in 与应用单元在 mkosi.extra 里，
        # 不装 gnome-kiosk-script-session——它的会话跑 ~/.local/bin 里的任意脚本）；zenity 是 mastersos-kiosk enter 的确认与错误框。
        # 两个包都不带 [Install] 的用户单元、没有 postinst（resolute 的 gnome-kiosk 50.0-1、zenity 4.2.1-1），user-units.sh 的清单不用改
        gnome-kiosk
        zenity
        plymouth-theme-spinner
        # AppArmor 的用户态（apparmor.service 开机载入 /etc/apparmor.d 的配置，并带来 Ubuntu 默认的
        # kernel.apparmor_restrict_unprivileged_userns=1）。没有它时内核里的 AppArmor 一条配置都没有、
        # 这个开关是 0（Task 9 在 VM 165 上看到的）；Chrome 的命名空间沙箱靠它的 chrome 配置放行 userns
        apparmor
        # Chrome 的 .deb 依赖，先放进 /usr，Chrome 本体由 agent 装成 sysext（/var/lib/extensions/google-chrome）
        libnss3
        libatk-bridge2.0-0t64
        libgbm1
        libvulkan1
        xdg-utils
        fonts-liberation
        wget
# authd 的 OIDC broker 由 mkosi.build 在 build overlay 里从源码编（Ruling 1）；git 只在 overlay 里，不进镜像。
# Go 不用发行版的 golang-go：mkosi.build 下载钉了 sha256 的官方工具链
BuildPackages=
        git
        # msgfmt: the login screen's and the system notices' catalogues (login-i18n/*.po, system-i18n/*.po), compiled by mkosi.build
        gettext
# 万一被别的包依赖带进来，也在最后拿掉：它会让第一个坐到屏幕前的人建出 sudo 账号（Ruling 18）
RemovePackages=gnome-initial-setup
RemoveFiles=
        /usr/lib/systemd/network/89-ethernet.network
        # Debian's localed may not set the keymap (a D-Bus deny on SetX11Keyboard, xorg.conf.d read-only). This image has no
        # keyboard-configuration, so localectl is the only keeper of it and the login screen writes it there (VM 121).
        /usr/share/dbus-1/system.d/org.freedesktop.locale1.read-only.conf
        /usr/lib/systemd/system/systemd-localed.service.d/x11-keyboard.conf
        # It asks every user to rename the home folders after a language change. gnome-session-services.target starts this
        # unit with a plain Wants=, so the session does not miss it; xdg-user-dirs.service still creates the folders, in English.
        /usr/lib/systemd/user/user-dirs-update-gtk.service
        # 上游的自动更新定时器：reboot 那个会在装好新版本后自动重启；更新只走 mastersos-update.timer（不重启）
        /usr/lib/systemd/system/systemd-sysupdate.timer
        /usr/lib/systemd/system/systemd-sysupdate-reboot.timer
        /usr/lib/systemd/system/systemd-sysupdate-reboot.service

[Validation]
# SecureBootKey= / SecureBootCertificate= 不写在这里：build.sh 以 --secure-boot-key/-certificate 传入构建机的
# ~/mastersos-keys/db.{key,crt}（也签 verity）。它签 systemd-boot（ESP 上的 grubx64.efi）与 UKI；它的证书的 DER
# 就是 keys/mastersos-mok.der——shim + MOK 路线里每台机器登记一次的 MOK，「BIOS 追加 db」备选路线里追加的
# 也是它（docs/secure-boot.md）。mkosi.finalize 核对两者配对。
SecureBoot=yes
# 正式镜像不自动导入钥匙（ESP 上没有 loader/keys/auto/）；lab profile 才打开
SecureBootAutoEnroll=no
# UKI 带签名的 PCR 11 策略（.pcrsig/.pcrpkey）；数据分区只绑它与 pcrlock（只锁 PCR 7），不绑字面 PCR。
# SignExpectedPcrKey= / SignExpectedPcrCertificate= 不写在这里：钥匙在构建机的 ~/mastersos-keys/pcr.{key,crt}
# （RSA 2048，与 Secure Boot / verity 的 db.key 分开），build.sh 以 --sign-expected-pcr-key/-certificate 传入。
# 签名阶段（4b Task 4，Ruling 28）：数据盘的 PCR 11 签名只覆盖 enter-initrd 一个阶段——离开 initrd 进到
# 用户态之后 TPM 不再放行（spec §6.12 (a)：另一块盘或 U 盘上带我们签名、进到用户态拿到 root 的 MastersOS
# 就解不开内置盘的数据分区）。mkosi v27.1 没有对应设置、默认把 --pcr-private-key 交给 systemd-measure 的
# 默认四阶段（enter-initrd、…:leave-initrd、…:sysinit、…:ready），也不接受在 ukify.conf 里补 Phases=
# （它与命令行给的私钥不在同一个「组」，ukify 会报 --phases 必须与 --pcr-private-key 一一对应）。
# 做法：build.sh 用 ExtraSearchPaths=（--extra-search-path）在 PATH 最前放一个名为 `ukify` 的包装脚本
# （mkosi 以 `python3 <ukify> build …` 调它），它在 build 子命令且有 --pcr-private-key 时注入一条
# --phases=enter-initrd（与那一个私钥的组配对），再 exec 真正的 ukify。两个 profile（主系统、恢复出厂）
# 用同一次 ukify build，注入一致生效。不改 mkosi 源码、不在构建后重写 UKI（lab/results/2026-10-15-4b/t4-initrd-only.txt）。
# publish.sh / channel-common.sh 的 check_uki 据此要求每个 profile 的 sha256 签名**恰好一条、阶段 enter-initrd**
# （原来是四条）：阶段变了、或换过签名钥匙（.pcrpkey 是退役的那把）就发不出去（docs/keys.md）。
SignExpectedPcr=yes
Verity=signed

[Runtime]
RAM=4G
