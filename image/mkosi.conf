# MastersOS 镜像。由 spikes/s2/mkosi 提升而来；结构照 systemd/particleos（LGPL-2.1-or-later）改写成
# Ubuntu 26.04 + GNOME。镜像里只有 ESP + 一套 /usr（erofs + dm-verity + 签名）；B 槽、加密的根分区、
# 种子分区都由首次开机时 initrd 里的 systemd-repart 按 /usr/lib/repart.d 建出来。
#
# 不要直接跑 mkosi，用 build.sh：它传入当天的 Snapshot=、签名钥匙（VM 161 的 ~/mastersos-keys/）、
# MASTERSOS_UPDATE_BASE，并把 agent 等二进制作为附加树放进来。试验网用 --profile lab（mkosi.profiles/lab.conf）。

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,universe,restricted
# Snapshot= 由 build.sh 以 --snapshot=<YYYYMMDDTHHMMSSZ> 传入（默认当天 00:00 UTC），
# 同一提交 + 同一快照 → 同一组包。值记在输出目录的 build-info.txt。

[Build]
CacheDirectory=mkosi.cache
Incremental=yes
WithNetwork=yes
# PAM 钩子（4b Ruling 4、5）：postinst 只在它等于 1 时往 common-account 插 pam-check、往 gdm-password 与 gdm-authd
# 插 pam-session（pam-hooks.sh）。agent 有了这两个子命令（Task 10、11）才设；lab profile 同样设（mkosi.profiles/lab.conf）
Environment=MASTERSOS_PAM_HOOKS=1

[Output]
Format=disk
ImageId=MastersOS
Output=%i_%v_%a
SplitArtifacts=uki,partitions
ManifestFormat=json
OutputDirectory=mkosi.output

[Content]
Bootable=yes
Bootloader=systemd-boot
# 微软签名的 shim → 我们签名的 systemd-boot（grubx64.efi）→ UKI（S2 的 v4 路线）
ShimBootloader=signed
UnifiedKernelImageFormat=%i_%v_%a
# profile 1：「恢复出厂」（命令行追加 systemd.factory_reset=1，Ruling 13）。每个 profile 都签 PCR 11
UnifiedKernelImageProfiles=uki-profiles/factory-reset.conf
# quiet splash: the MastersOS boot splash from the initrd on, no kernel text (design 2026-11-04 visual identity §5.2). The lab
# profile adds console=ttyS0, so the serial console still shows everything.
KernelCommandLine=
        quiet
        splash
        root=dissect
        mount.usr=dissect
        rw
        console=tty0
        systemd.firstboot=off
        systemd.crash_reboot=1
        panic=10
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
        systemd.image_filter=usr=MastersOS_*:usr-verity=MastersOS_*:usr-verity-sig=MastersOS_*:root=MastersOS-*
# exfat: the Ventoy installer mounts the stick in the initrd (vfat is built in on the Ubuntu kernel). KernelInitrdModules= is a
# main-image setting that mkosi hands to the default initrd build, so it lives here and not in mkosi.initrd.conf/mkosi.conf.
KernelInitrdModules=default
KernelInitrdModules=/drivers/gpu/drm
KernelInitrdModules=exfat
Packages=
        linux-image-generic
        linux-firmware
        systemd
        systemd-boot
        systemd-boot-tools
        systemd-boot-efi
        systemd-container
        systemd-cryptsetup
        systemd-repart
        systemd-resolved
        systemd-timesyncd
        systemd-ukify
        shim-signed
        udev
        dbus-broker
        libnss-systemd
        libnss-myhostname
        libpam-systemd
        cryptsetup-bin
        # 安装器（Task 11）在用户态跑 systemd-repart：ESP 要 mkfs.vfat、种子分区要 mkfs.ext4。首次开机的 repart
        # 在 initrd 里，用的是 initrd 自己的 mkfs，/usr 里本来没有这两个
        dosfstools
        e2fsprogs
        tpm2-tools
        apt
        dpkg
        gpgv
        ca-certificates
        curl
        # golden-fetch (usr self-repair Task 7) unpacks the channel's .raw.zst files itself; systemd-sysupdate links libzstd but
        # the image had no zstd command (20261027.4)
        zstd
        gnupg
        sudo
        login
        passwd
        locales
        iproute2
        iputils-ping
        less
        nano
        jq
        network-manager
        # NetworkManager only Recommends it and mkosi installs no Recommends: without it Wi-Fi never finds a network (20261029.1)
        wpasupplicant
        # Remote diagnostics (docs/specs/2026-11-05-remote-diagnostics-and-help-design.md): the collector runs these for the package
        # (Wi-Fi interfaces and regulatory domain, PCI and USB devices with their drivers). Not libinput-tools: it pulls python3
        iw
        pciutils
        usbutils
        mokutil
        efibootmgr
        # 换 shim 之前用本机的活动 db 验签（4b Task 22）：mastersos-agent shim-check 用 openssl 验签名链、sbverify 验哈希
        # （openssl 本来就随 ca-certificates 进来，这里写明是因为 shim-check 直接调它）
        sbsigntool
        openssl
        # 硬件（4b Task 22，spec §6.2）：Tiger Lake 的 Latitude 3420/5420 没有 SOF 固件就没有声卡；3420 会降频，thermald 缓解。
        # 不装 fprintd / libpam-fprintd（第一期不支持指纹）与 dkms（mkosi 默认不装 Recommends；check-tree 第 25 条守着）
        firmware-sof-signed
        thermald
        # Compressed swap in RAM (usr/lib/systemd/zram-generator.conf): the image has no swap partition
        systemd-zram-generator
        # Crash reports of the login stack and the agent (usr/lib/mastersos/coredump-filter)
        systemd-coredump
        flatpak
        # 登录（4b）：authd 接学校的身份系统
        authd
        # authd 的 /etc/pam.d/gdm-authd 在 auth 段里只剩 pam_gnome_keyring 能给 setcred 一个「成功」：没有它，
        # SSO 用户认证通过之后 setcred 落空、PAM 返回 Permission denied，进不了桌面（4b Task 8 在 VM 165 实测）
        libpam-gnome-keyring
        # libpwquality 的字典检查要 cracklib 的字典（GNOME 设置里改口令用它）；字典由 postinst.chroot 挪进 /usr
        cracklib-runtime
        # 打印与扫描
        cups
        sane-airscan
        simple-scan
        # agent 要用的命令行工具（通知、dconf 写系统默认值）
        libnotify-bin
        dconf-cli
        # gettext(1): notice-lib and the agent translate the notices through it (system-i18n/README.md); not in the image otherwise
        gettext-base
        # GNOME：比 ubuntu-desktop-minimal 更小的一组；不带 gnome-initial-setup（Ruling 18）
        gdm3
        gnome-shell
        # Upstream GNOME (design 2026-11-10): our session mastersos, no ubuntu-session, ubuntu-settings or Yaru (Adwaita)
        gnome-session
        gnome-control-center
        gnome-terminal
        nautilus
        # Only for the tray (ubuntu-appindicators@ubuntu.com): resolute ships Ubuntu's seven extensions in this one package;
        # postinst removes the other six (Dock, desktop icons, tiling, snapd, web search) and checks each is gone
        gnome-shell-ubuntu-extensions
        # postinst rebuilds the hicolor icon cache after adding the MastersOS logo (design 2026-11-04 visual identity §5.1)
        gtk-update-icon-cache
        fonts-noto-core
        fonts-noto-cjk
        fonts-thai-tlwg
        # Interface translations: every language Ubuntu has a pack for in this release (85; design 2026-11-01). The login screen's
        # language list is made from what is installed here, and postinst.chroot generates every UTF-8 locale. Without the pack a
        # language only changes date formats (VM 165).
        # Chrome 自带各语言的界面，跟 LANG 走
        language-pack-af
        language-pack-gnome-af
        language-pack-am
        language-pack-gnome-am
        language-pack-an
        language-pack-gnome-an
        language-pack-ar
        language-pack-gnome-ar
