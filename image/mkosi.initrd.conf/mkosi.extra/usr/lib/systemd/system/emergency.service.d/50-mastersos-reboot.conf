# When something goes wrong in the initrd (any RequiredBy=initrd.target unit fails, the root partition cannot be mounted, ...),
# do not start the emergency shell: restart after 10 seconds. A new version with a boot counter then falls back to the previous
# one after three tries (Task 2: upstream's emergency.service waits at "Press Enter for system maintenance", the machine never
# restarts and the counter never runs out; rd.emergency=reboot is a dracut parameter systemd does not know). This also removes
# the maintenance shell from the initrd: the data partition may already be unlocked at that point.
# Only in the initrd (this extra tree only goes into the initrd); the main system's emergency is unchanged.
# The console font has no CJK glyphs: the message is English only.
[Unit]
SuccessAction=reboot
FailureAction=reboot

[Service]
ExecStartPre=
ExecStart=
ExecStart=-sh -c 'echo "MastersOS: the boot failed in the initrd, restarting in 10 seconds. A new version that fails to boot three times in a row falls back to the previous one automatically."; sleep 10'
