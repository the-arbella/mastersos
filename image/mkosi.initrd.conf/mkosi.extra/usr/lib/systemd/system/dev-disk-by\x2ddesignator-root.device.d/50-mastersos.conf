# initrd 里等根分区（解开之后的 /dev/disk/by-designator/root）的时限。默认 90 秒（DefaultDeviceTimeoutSec）
# 从这个设备的任务开始运行算：要输入恢复密钥时，提示出现约 90 秒后这个设备的任务超时 → emergency → 10 秒后重启，
# systemd-cryptsetup@root 的 timeout=300 根本轮不到（Task 3 在 VM 167 上实测：提示到重启 94 秒）。
# 放宽到 330 秒：口令提示自己 300 秒后失败，再过一会儿设备任务超时 → emergency（50-mastersos-reboot）→ 重启。
# 不设成 infinity：口令提示失败之后没有别的东西会让启动失败，机器会一直停在那里，启动计数也就用不完。
[Unit]
JobRunningTimeoutSec=330
# 排在恢复出厂的确认之后（4b Task 5 复审 I1）：JobRunningTimeoutSec 只从任务真正开始运行时算，等着 After= 的任务
# 不算。没有这一行时 330 秒从 initrd 一开始就在走，受管机器上问恢复密钥（3 × 300 秒）加 ERASE（60 秒）最多 960 秒，
# 慢慢输入的人会在输到一半时被 emergency 重启。平常开机确认单元的条件不成立、几乎立即「完成」，等待照旧。
# 确认单元自己的每个提示都有时限，超时就离开恢复出厂模式、数据不动（fail closed），所以这里不会无限等。
After=mastersos-factory-reset-confirm.service
