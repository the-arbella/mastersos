# Ventoy installer: the device jobs for the /usr chain are queued when the initrd starts and their 90 s running timeout
# (DefaultDeviceTimeoutSec) would end in emergency -> reboot while mastersos-ventoy-attach is still looking for the stick or
# showing a refusal. JobRunningTimeoutSec counts only from when the job starts running, and a job waiting on After= does not
# run, so ordering after the attach unit moves the 90 s to after the attach. Inert on every other boot: the unit's
# ConditionKernelCommandLine= is false there, so the unit is in the transaction but skipped, and After= on a skipped unit is a no-op
# (same pattern as dev-disk-by\x2ddesignator-root.device.d/50-mastersos.conf).
[Unit]
After=mastersos-ventoy-attach.service
