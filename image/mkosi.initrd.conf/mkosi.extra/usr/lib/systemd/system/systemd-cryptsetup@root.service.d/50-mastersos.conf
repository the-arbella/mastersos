# 根分区（gpt-auto 生成的 systemd-cryptsetup@root.service）的解锁选项。gpt-auto 生成器不读
# rd.luks.options=（只有 cryptsetup 生成器读，它管 crypttab 与 rd.luks.uuid=），所以内核命令行上的
# rd.luks.options= 对这个卷不起作用（systemd 259 源码与实测）——在 initrd 里用 drop-in 换掉 ExecStart。
# 前四段与 gpt-auto 生成的一模一样（root=dissect 时设备是 /dev/disk/by-designator/root-luks），加一项：
#   timeout=300           口令提示 5 分钟没人输就失败；根设备的等待（dev-disk-by\x2ddesignator-root.device.d，
#                         330 秒）随后超时 → initrd 的 emergency.service（50-mastersos-reboot）10 秒后重启：带启动
#                         计数的版本因此能退回上一版；不带计数的版本每次开机再提示一次（不是砖：输入恢复密钥照样进得去）
# 没有 TPM 的机器装不上（安装器拒装，Ruling 17），数据分区一定有 TPM2 槽：不试空口令。
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-cryptsetup attach 'root' '/dev/disk/by-designator/root-luks' '' 'tpm2-device=auto,tpm2-measure-pcr=yes,tpm2-measure-keyslot-nvpcr=cryptsetup,timeout=300'
