# repart 要用首次开机的临时钥匙给新建的根分区加一个不属于任何 token 的钥匙槽（repart.d/40-root.conf 的
# Encrypt=key-file+tpm2）。Requires= 保证钥匙先生成出来：生不出来 repart 就不跑，绝不拿空钥匙建分区。
# ExecStart= 先清空、再照抄 systemd 259 的 systemd-repart.service 的 ExecStart，末尾加 --key-file
# （原文记在 systemd-version.verified）。只在 initrd 里；平常开机 repart 不建分区，这个 --key-file 用不上。
[Unit]
Requires=mastersos-luks-bootstrap-key.service
After=mastersos-luks-bootstrap-key.service

[Service]
ExecStart=
ExecStart=systemd-repart --dry-run=no --key-file=/run/mastersos/luks-bootstrap-key
