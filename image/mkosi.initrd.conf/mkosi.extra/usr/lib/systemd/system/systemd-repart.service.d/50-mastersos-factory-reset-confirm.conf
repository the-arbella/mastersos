# repart 要等恢复出厂的确认（mastersos-factory-reset-confirm.service）走完，而且确认单元**失败**时 repart 不跑：
# 宁可这次开机失败（找不到根分区 → initrd 重启），也不在没确认的情况下删掉数据。平常开机那个单元的条件
# （命令行带 systemd.factory_reset=1）不成立，条件不成立不算失败，repart 照常跑。
[Unit]
Requires=mastersos-factory-reset-confirm.service
After=mastersos-factory-reset-confirm.service
