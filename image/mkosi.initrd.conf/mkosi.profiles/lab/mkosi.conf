# lab profile of the default initrd (mkosi parses mkosi.initrd.conf/ as a config directory with parse_profiles, and the initrd
# inherits Profiles= from the main image, so `build.sh --profile lab` reaches this directory; mkosi v27.1 config.py
# finalize_default_initrd). Only adds /usr/lib/mastersos/profile = lab to the initrd: the main image's profile file lives in the
# signed /usr, which is not mounted yet when usr-repair runs. usr-repair honours EFI/MastersOS/lab-fail-verify only with it
# (usr-self-repair Task 6; Task 10 acceptance item 8). build.sh checks the initrd has it on lab builds and lacks it otherwise.
