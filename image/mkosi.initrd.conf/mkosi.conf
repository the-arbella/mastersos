# mkosi 默认 initrd 的附加配置（mkosi v27.1：主配置目录里的 mkosi.initrd.conf/ 目录，按普通配置目录解析——
# config.py finalize_default_initrd 先 parse 它、再 parse mkosi 打包进来的 mkosi-initrd/mkosi.conf；
# 其中的 mkosi.extra/ 进 initrd）。
# 加 cryptsetup：首次开机 / 恢复出厂的临时钥匙单元（mastersos-luks-bootstrap-{key,persist}）用 `cryptsetup luksUUID`
# 与 `cryptsetup open --test-passphrase`；恢复出厂的确认（Task 5）也要它。默认 initrd 本来没有 cryptsetup CLI
# （只有 systemd-cryptsetup）。
# systemd-container: ventoy-attach attaches the Ventoy system file with `systemd-dissect --attach --loop-ref=` (Ubuntu ships
# systemd-dissect in systemd-container, not in systemd; build.sh fails the build when it is missing from the initrd).

[Content]
Packages=cryptsetup-bin
Packages=systemd-container
# The boot splash from the start (design 2026-11-04 visual identity §5.2): plymouthd and the systemd units that start it and
# answer password prompts through it (plymouth), the two-step module our theme uses (it ships in plymouth-theme-spinner, whose
# keyboard pictures the theme links to), and the text plugin with its fonts (plymouth-label: pango, fonts-ubuntu), without
# which the recovery key prompt and messages draw nothing. Our theme itself is in mkosi.extra/ here.
Packages=plymouth
Packages=plymouth-label
Packages=plymouth-theme-spinner
