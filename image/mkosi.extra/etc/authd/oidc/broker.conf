# MastersOS 镜像自带的 broker 配置骨架（跟着镜像走：/etc/authd/oidc/broker.conf 是链接回 /usr/share/factory 的 L）。
# 学校的身份系统（issuer、client_id，身份系统要求时还有 client_secret）由 mastersos-agent 写在 broker.conf.d/10-mastersos.conf（0600）；
# 那里没有文件时 broker 不启动（authd-oidc.service 的 ConditionDirectoryNotEmpty=）。
# 上游的完整样例与每个键的说明：/usr/share/doc/authd-oidc/broker.conf.example。
[oidc]

[users]
# Without school settings everyone the identity provider signs in goes through to authd. The agent's drop-in adds the
# school's administrators to allowed_users, and the school's domains go to mastersos-allowed-domains beside this file
# (patch 0006, never a key here: a broker without the patch would not start), so that accounts outside them are refused
# before authd registers them; the login methods and the lock are decided by PAM's mastersos-agent pam-check (spec §6.10 S1).
# 不用 OWNER：否则第一个登录的人成了「owner」，broker 还要往只读的 broker.conf.d/ 写一个 drop-in。
allowed_users = ALL
