# MastersOS（4b Task 13；2026-11-10 起会话是 mastersos）：会话的 XDG_CURRENT_DESKTOP 是 MastersOS:GNOME，xdg-desktop-portal 先找 mastersos-portals.conf
#（名字取第一项、小写），
# 有了它就不再读 gnome-session-common 的 gnome-portals.conf，所以下面照抄那份，只多一行 FileChooser。
# 文件选择框改走 xdg-desktop-portal-gtk：GNOME 50 的 portal-gnome 把它交给 Nautilus，浏览器模式下 Nautilus 被堵住，
# Chrome 的上传与「另存为」就弹不出框（VM 165 上实测）。两种模式用同一个选择框。
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
