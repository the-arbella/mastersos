<?xml version="1.0" encoding="UTF-8"?>
<!-- authd 的 OIDC broker（com.ubuntu.authd.Oidc，上游 snap 的总线名）。系统总线默认谁都不能拥有名字、
     不能调方法：只有 root 能拥有它，只有 root 能调它——调它的是 authd（以 root 跑）。
     普通用户不能直接问 broker 要会话、绕过 authd 与 PAM。 -->
<busconfig>
  <policy user="root">
    <allow own="com.ubuntu.authd.Oidc"/>
    <allow send_destination="com.ubuntu.authd.Oidc"/>
  </policy>
  <policy context="default">
    <deny own="com.ubuntu.authd.Oidc"/>
    <deny send_destination="com.ubuntu.authd.Oidc"/>
  </policy>
</busconfig>
