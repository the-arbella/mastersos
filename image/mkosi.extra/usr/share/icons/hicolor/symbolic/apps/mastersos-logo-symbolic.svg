    <rect x="76" y="16" width="12" height="70" rx="6"/>
    <rect x="-6" y="-6" width="43.24" height="12" rx="6" transform="translate(18 22) rotate(50.19)"/>
    <rect x="-6" y="-6" width="43.24" height="12" rx="6" transform="translate(82 22) rotate(129.81)"/>
    <circle cx="50" cy="61" r="11"/>
  </g>
</svg>
