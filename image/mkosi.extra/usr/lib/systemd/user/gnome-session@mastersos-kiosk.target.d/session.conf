# 锁定应用会话的组件（计划 9 Task 8）：合成器 gnome-kiosk 与应用 org.mastersos.KioskApp.service（mastersos-kiosk run）。
# 形状照 gnome-kiosk 50 的 gnome-kiosk-script 会话（gnome-session@gnome-kiosk-script.target.d/session.conf），去掉远程共享
# （Sharing）；无障碍与媒体键（音量）照留，媒体键里起程序的快捷键由 kiosk 的 dconf 清空
[Unit]
Requires=org.gnome.Kiosk.target
Requires=org.mastersos.KioskApp.service
Wants=org.gnome.SettingsDaemon.A11ySettings.target
Wants=org.gnome.SettingsDaemon.MediaKeys.target
