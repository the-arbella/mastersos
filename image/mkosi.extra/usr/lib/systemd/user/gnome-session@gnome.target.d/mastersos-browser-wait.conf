# The regular desktop session "gnome" (/usr/share/wayland-sessions/gnome.desktop: gnome-session --session=gnome) waits for the web
# browser. A drop-in, not a .wants/ link: image/user-units.sh wants every link in /etc too. Not on gnome-session.target,
# which the locked-app session reaches as well (mastersos-browser-wait.service).
[Unit]
Wants=mastersos-browser-wait.service
