# The regular desktop session "ubuntu" reminds the user of an installed update that waits for a restart
# (mastersos-update-reminder.service). A drop-in, not a .wants/ link: image/user-units.sh wants every link in /etc too. Not on
# gnome-session.target, which the locked-app session reaches as well.
[Unit]
Wants=mastersos-update-reminder.service
