# 不给每个用户分 journal 文件（4b Task 11 复审 I1）。默认的 SplitMode=uid 会把 uid 1999 的消息写进
# /var/log/journal/<机器>/user-1999.journal 并给 1999 读权限：每位访客都是 uid 1999，下一位访客用
# journalctl --user 就读得到上一位的应用日志（打开的文件名、网址……），而且重启也还在。
# none：用户的消息只进系统 journal（root、adm、systemd-journal 才读得到）；代价是学生没有 journalctl --user。
# 以前的镜像写下的 user-1999*.journal 由 mastersos-agent guest-cleanup 删掉
[Journal]
SplitMode=none
