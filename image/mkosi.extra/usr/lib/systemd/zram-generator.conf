# Compressed swap in RAM (2026-11-06): the image has no swap partition, and a 4 GB laptop with ten browser tabs had 1.5 GB
# left (20261105.15 on VM 124). zstd usually packs browser memory about 3:1, so the device may be as large as RAM.
# Same sizing as Fedora: as large as RAM, at most 8 GB.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
swap-priority = 100
