# 访客（4b Ruling 5）：注销时 logind 杀掉访客会话里的全部进程（后台的 nohup、setsid 也一样），访客的
# user@1999.service 随之停下、拉起 mastersos-guest-cleanup.service。KillOnlyUsers= 只在 KillUserProcesses=yes 时起作用：
# 只有访客受影响，其他用户注销后留着的后台进程照旧
# RemoveIPC=yes：用户最后一次退出时删掉它的 SysV 共享内存、信号量与 POSIX 消息队列（复审 M1）。上游默认就是 yes，
# 发行版可能改过，这里写明，不靠默认值
[Login]
KillUserProcesses=yes
KillOnlyUsers=guest
RemoveIPC=yes
