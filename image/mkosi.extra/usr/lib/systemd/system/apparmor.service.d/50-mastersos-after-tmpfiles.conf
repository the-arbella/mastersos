# /etc/apparmor.d is a symlink into /usr/share/factory that systemd-tmpfiles-setup.service creates (00-mastersos-factory-etc.conf,
# written by mkosi.finalize). On the first boot /etc starts empty and apparmor.service (DefaultDependencies=no, only ordered after
# local-fs.target) used to win the race: "Unable to find profiles directory", no profile loaded at all, and with
# kernel.apparmor_restrict_unprivileged_userns=1 every user namespace was refused — Chrome's sandbox died at start
# (credentials.cc "Permission denied") and bwrap was denied, until the next reboot (device trial 2026-10-31, VM 106 and 121).
[Unit]
After=systemd-tmpfiles-setup.service
