# 开机快速应用（mastersos-agent-local.service 自己排在 GDM 之前）。用 Wants= 而不是 Requires=：它失败或
# 超时都不挡登录界面。写在 gdm.service.d 而不是 display-manager.service.d：后者只是别名。
[Unit]
Wants=mastersos-agent-local.service
# 浏览器模式的桩：按 agent 记下的模式在登录界面之前再挂一次（mastersos-agent-local 失败或超时、sysext 没跑时也不漏，
# 复审 T13 发现 4）。`-` 前缀：失败不挡 GDM。
[Service]
ExecStartPre=-/usr/bin/mastersos-agent exec-block
