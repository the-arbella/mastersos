# Make sure /tmp/.X11-unix and /tmp/.ICE-unix are root:root 1777 before the greeter starts (x11.conf's D! lines: created when
# missing, owner and mode reset when present; nothing inside is removed without --remove). Defence in depth for the boot
# ordering in systemd-tmpfiles-setup.service.d/50-mastersos-mounts.conf: when the greeter's gnome-shell has to create
# /tmp/.X11-unix itself it is gdm-greeter 1755, and every later desktop session's gnome-shell aborts (2026-11-06).
# `-`: a failure here must not keep GDM from starting.
[Service]
ExecStartPre=-/usr/bin/systemd-tmpfiles --create --boot --prefix=/tmp/.X11-unix --prefix=/tmp/.ICE-unix
