# pcrlock 只锁 PCR 7（Secure Boot 策略与签发者，Ruling 7）。上游默认的 PCR 集合还锁住固件代码与配置
# （PCR 0–5）和 UKI，每次镜像更新、每次 Dell BIOS 更新都会落到输入恢复密钥；签名的 PCR 11 已经管着 UKI。
# 这个单元只生成 /var/lib/systemd/pcrlock.json 与 TPM 里的 NV 策略，不碰 LUKS 槽：TPM 槽什么时候改成
# 「签名 PCR 11 + pcrlock」由 agent 在恢复密钥托管确认之后才做（Task 8）。
# db/dbx 变了的那次开机（只能用恢复密钥进来）里，它按新的 PCR 7 重新生成策略，下次开机恢复无感。
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-pcrlock make-policy --location=770 --pcr=7
