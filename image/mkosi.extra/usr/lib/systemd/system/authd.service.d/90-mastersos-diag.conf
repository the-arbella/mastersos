# Developer diagnostics (docs/specs/2026-11-03-diagnostics-design.md): /run/mastersos/diag.env exists only when the
# switch /var/lib/mastersos-seed/debug.conf does (mastersos-diag-setup.service)
[Unit]
After=mastersos-diag-setup.service

[Service]
EnvironmentFile=-/run/mastersos/diag.env
# Same ExecStart as Ubuntu authd 0.6.1, plus -vv (DEBUG) with the switch; empty otherwise, so the argument is dropped
ExecStart=
ExecStart=/usr/libexec/authd $MASTERSOS_DIAG_AUTHD_ARGS
