# 浏览器模式的桩挂在 /usr 的文件上；sysext 合并（开机）与刷新（Chrome 更新后 reload）换掉 /usr 上的 overlay，
# 挂在旧 overlay 上的桩随之消失、或被新 overlay 盖住。合并或刷新之后按 agent 记下的模式重挂
# （mastersos-agent exec-block，读 /var/lib/mastersos-system/exec-block-mode；等 agent 的锁最多 10 秒，等不到也照样按它收敛）。
# `-` 前缀：它失败不让 sysext 失败；ExecReload= 在上游的 `systemd-sysext refresh` 之后追加。
[Service]
ExecStartPost=-/usr/bin/mastersos-agent exec-block
ExecReload=-/usr/bin/mastersos-agent exec-block
