# Developer diagnostics (docs/specs/2026-11-03-diagnostics-design.md): /run/mastersos/diag.env exists only when the
# switch /var/lib/mastersos-diag/enabled does (mastersos-diag-setup.service)
[Unit]
After=mastersos-diag-setup.service

[Service]
EnvironmentFile=-/run/mastersos/diag.env
# Same ExecStart as Ubuntu wpasupplicant 2.11, plus -d (debug level) with the switch; never -K (show keys)
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -u -s -O "DIR=/run/wpa_supplicant GROUP=netdev" $MASTERSOS_DIAG_WPA_ARGS
