# Wait for the mounts that tmpfiles writes into (/tmp/.X11-unix and the rest of x11.conf; the
# `z /var/lib/mastersos-seed 0700` line of mastersos.conf). Upstream orders this unit only After=local-fs.target, and on this
# image that is not enough: the main system has no device-mapper udev rules, so udev's coldplug marks the /usr and root dm
# devices SYSTEMD_READY=0, usr.mount gets a stop job and the pending local-fs.target start job is cancelled (VM 124,
# 2026-11-06). tmpfiles then ran before tmp.mount (late since .18, which orders it after zram's swap.target) and created
# /tmp/.X11-unix on the root file system under the tmpfs; the greeter made its own gdm-greeter 1755 copy and the first desktop
# session's gnome-shell aborted. WantsMountsFor= (not Requires): a missing or failed mount must not stop tmpfiles.
[Unit]
WantsMountsFor=/tmp /var/lib/mastersos-seed
