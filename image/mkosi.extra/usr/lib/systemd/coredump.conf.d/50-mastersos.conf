# Cores of the login stack and the agent only (usr/lib/mastersos/coredump-filter). Kept on the device: a diagnostics package
# carries the journal's crash summary, never the core itself. At most 256 MB each and 512 MB in all (oldest go first), always
# 1 GB of /var left free; usr/lib/tmpfiles.d/mastersos-coredump.conf removes any older than 7 days.
[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=256M
ExternalSizeMax=256M
MaxUse=512M
KeepFree=1G
