# 用户会话的 XDG_DATA_DIRS 最前面是 agent 的覆盖目录（Ruling 7）：浏览器模式用 Hidden=true 盖掉的 .desktop、
# 网页应用的启动器与图标、D-Bus 激活的覆盖都放在 /var/lib/mastersos-public/xdg（root 0755，用户读得到）。
# Flatpak 的用户环境生成器（60-flatpak）可能把它的导出目录插到更前面（Task 13 Step 5 实测）。
# Settings format 3 (user layer): /var/lib/mastersos-public/session/xdg comes first, the xdg dir of the signed-in person's
# user config behind the `session` link (absent on format 1/2 Devices, where the entry matches nothing).
XDG_DATA_DIRS=/var/lib/mastersos-public/session/xdg:/var/lib/mastersos-public/xdg:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
