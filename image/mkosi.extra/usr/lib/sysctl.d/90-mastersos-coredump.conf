# Crashes go through coredump-filter, which passes only the login stack and the agent on to systemd-coredump (replaces the
# pattern from systemd-coredump's 50-coredump.conf; same arguments, with the process name in front)
kernel.core_pattern = |/usr/lib/mastersos/coredump-filter %e %P %u %g %s %t %c %h %d %F
