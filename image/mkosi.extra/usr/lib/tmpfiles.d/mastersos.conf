# agent 的状态在加密的根分区上（apply 脚本的副本写到 /var/lib/mastersos/run/ 再执行，所以不在 noexec 的挂载上）
d /var/lib/mastersos 0700 root root -
d /var/lib/mastersos-system 0700 root root -
# 种子分区的挂载点（mastersos-seed-generator 生成的挂载排在 local-fs.target 之前，这里改的是分区根目录）
z /var/lib/mastersos-seed 0700 root root -
# Chrome（Task 9）：mastersos-chrome.service 是 ProtectSystem=strict，只能写这两个目录，要事先建好
d /var/lib/mastersos/chrome 0700 root root -
d /var/lib/extensions 0755 root root -
# 用户会话要读的东西（4b Ruling 7、9）：xdg 覆盖（浏览器模式、网页应用）与导出的 login 脚本。root 0755，不放秘密
d /var/lib/mastersos-public 0755 root root -
d /var/lib/mastersos-public/xdg 0755 root root -
# 浏览器模式的 D-Bus 激活覆盖（agent 的 desktop 步骤写）所在的目录要在会话总线起来之前就在（4b Task 24 复审 I1）：会话总线
# （dbus-broker 与 dbus-daemon 都一样）只监视起来时已存在的服务目录。从没进过浏览器模式的机器上它不存在，会话中途切到浏览器
# 模式时总线看不到新写的覆盖，Files / Settings 的 D-Bus 激活直到重新登录才被堵（VM 165 在 .29 与 .30 上实测）
d /var/lib/mastersos-public/xdg/dbus-1 0755 root root -
d /var/lib/mastersos-public/xdg/dbus-1/services 0755 root root -
d /var/lib/mastersos-public/login-scripts 0755 root root -
# 登录队列（4b Task 18）：pam-session 往里放 <uid>、agent 取走；两级都是 root:root 0700（复审 M5：不让 PAM 里继承来的组与 umask
# 决定它们的属主与权限；initrd 先建的 /run/mastersos 也是 0700）
d /run/mastersos 0700 root root -
d /run/mastersos/login-queue 0700 root root -
# 锁定应用（计划 9 Task 8）：pam_namespace 把 kiosk 账号的 /etc/opt/chrome/policies/managed 换成这里的 <账号>/（agent 写的
# namespace.d/mastersos-kiosk.conf）。实例的父目录必须事先在、属 root、权限 000，否则 pam_namespace 报「Mode of inst parent
# not 000 or owner not root」、会话起不来（pam_namespace(8)；不用 ignore_instance_parent_mode 放宽）。D：每次开机清空——
# 删掉的应用留下的实例不留着，每个实例在会话开始时由 namespace.init 重新填（开机时没有会话挂着它们）
D /var/lib/mastersos-kiosk-ns 0000 root root -
