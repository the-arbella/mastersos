# /etc、/var、/home 都在这里：LUKS2 + TPM2，恢复出厂时丢弃重建。
# 不绑字面 PCR（TPM2PCRs= 为空）：initrd 里的 systemd-repart 自动用 UKI 的 .pcrpkey（systemd-stub 放到
# /.extra，tmpfiles 复制到 /run/systemd/tpm2-pcr-public-key.pem）绑签名的 PCR 11 策略；这时还没有
# pcrlock.json。恢复密钥托管确认后由 agent 再把 TPM 槽换成「签名 PCR 11 + pcrlock（只锁 PCR 7）」（Ruling 7）。
# TPM 2.0 是前提（Ruling 17）：没有可用 TPM 的机器安装器拒装，这里没有别的加密方式。
# Encrypt=key-file+tpm2（check-tree.sh 第 13 条要求恰好一行）：建分区时既绑签名的 PCR 11（TPM 槽），
# 又用 initrd 里 mastersos-luks-bootstrap-key 生成的那把临时钥匙（systemd-repart.service.d/50-mastersos-bootstrap-key.conf
# 的 --key-file=/run/mastersos/luks-bootstrap-key）加一个不属于任何 token 的钥匙槽。数据盘的 TPM 签名只覆盖
# enter-initrd（spec §6.12 (a)，4b Ruling 28），离开 initrd 之后 TPM 不放行；agent 在用户态用这把临时钥匙
# （mastersos-luks-bootstrap-persist 放进根分区）登记恢复密钥、换 TPM 槽，然后去掉这个临时钥匙槽。这个口令槽
# 不是「留给用户的口令」：它是一次性的、随机 32 字节，托管与 pcrlock 都好了之后 agent 就去掉（docs/keys.md）。
[Partition]
Type=root
Format=ext4
Label=MastersOS-root
SizeMinBytes=4G
Weight=20000
Encrypt=key-file+tpm2
TPM2PCRs=
FactoryReset=yes
MakeDirectories=/home /var/log/journal
