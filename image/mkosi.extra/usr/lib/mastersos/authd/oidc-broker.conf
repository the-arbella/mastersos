# authd 的 broker 注册（照上游 snap 的 conf/variants/oidc/authd.conf；mkosi.build 核对总线名与对象路径没变）。
# This file is NOT active here. mastersos-agent copies it to /etc/authd/brokers.d/oidc.conf only when the
# school has SSO configured (and removes that copy otherwise), so the GDM broker list shows OIDC only when it works.
[authd]
name = OIDC
brand_icon = /usr/share/authd-oidc/icon.svg
dbus_name = com.ubuntu.authd.Oidc
dbus_object = /com/ubuntu/authd/Oidc
