# lab profile：只给 PVE 试验网的 VM 用（Ruling 14）。真机 Dell 用正式 profile。
# 比正式镜像多：guest agent 与 sshd、串口控制台、试验用户与 GDM 自动登录、S2 的 loader.conf
# （等 3 秒出菜单），以及 setup mode 的 VM 自动导入我们的 Secure Boot 钥匙（loader/keys/auto/）。
# 试验用户的口令哈希与 authorized_keys 不入库：build.sh 从 VM 161 的 ~/mastersos-keys/lab-local 加进来。
# VM 163 上 Zitadel（https://zitadel.lan）与 Dex（https://dex.lan:5554）的试验 CA：
# lab.extra/usr/local/share/ca-certificates/mastersos-lab-test-ca.crt，postinst 的 update-ca-certificates 收进信任库。
# 只在 lab profile（Ruling 3：正式镜像只认公网信任的证书，tests/check-tree.sh 核对正式的树里没有额外的 CA）。
# Task 20 换的新 CA（CN=MastersOS lab test CA 2026-10，2031-10-17 到期，名字限制只许 .lan）：私钥在 VM 161 的
# ~/mastersos-keys/lab/test-ca/，叶子证书在那里签（S1 的旧 CA 2027-01-08 到期、私钥已不在）。
# 计划 6 Task 22 用同一把私钥、同一个名字重签了这张 CA 证书，名字限制加上 lab（云端试验的 *.cloud.lab 等）；
# 旧的叶子证书照样验得过。重签的证书在 VM 164 的 ~/mastersos-keys/lab/test-ca/ca.crt（VM 161 那份还是只许 .lan 的）。
# /etc 策略表的附加行在 etc-policy.lab.conf。

[Build]
# 与 mkosi.conf 相同：lab 也插 PAM 钩子（写在这里，免得有人只改了一边，tests/check-tree.sh 第 17 条核对两边都设）
Environment=MASTERSOS_PAM_HOOKS=1

[Content]
Packages=
        qemu-guest-agent
        openssh-server
# With the serial console, Plymouth uses its text mode: prompts (recovery key, factory reset) show on ttyS0 and are answered there,
# which the acceptance scripts rely on, and systemd.show_status keeps the boot log on the serial console despite quiet. The
# screenshot build (MASTERSOS_LAB_SPLASH=1 build.sh … --profile lab) adds plymouth.ignore-serial-consoles to show the real splash.
KernelCommandLine=console=ttyS0,115200 systemd.show_status=yes
ExtraTrees=mkosi.profiles/lab.extra
# 每台 lab 机器第一次开机自己生成主机钥匙，不用构建机上那一份
RemoveFiles=
        /etc/ssh/ssh_host_*

[Validation]
SecureBootAutoEnroll=yes
