# 主 UKI 的 profile 1「恢复出厂」（Ruling 13）：命令行在主 profile 之后追加 systemd.factory_reset=1，
# initrd 里的 systemd-repart 删掉带 FactoryReset=yes 的分区（加密的根分区 MastersOS-root）再按定义重建；
# 种子分区没有 FactoryReset=，保留。正式镜像的启动菜单默认不出（loader.conf timeout 0），开机按空格。
# 菜单里显示为「MastersOS <版本> (…) (ERASE ALL DATA - …)」：systemd-boot 把 TITLE 接在系统名后面，开头改不了；
# 条目的快捷键也不看标题——所有 UKI 条目都是 l（j/k 上下移）。真正的保护是 initrd 里的确认
# （mastersos-factory-reset-confirm.service：受管的机器先输恢复密钥，再打 ERASE；Ruling 22），标题只负责让人一眼看出
# 这一项会清空数据。
# 这个 profile 同样签了 PCR 11（mkosi 默认每个 profile 都签，publish.sh 的闸门逐个 profile 核对），
# 重建出来的根分区照样由 TPM 解开、不要输入。
[UKIProfile]
Profile=
        ID=factory-reset
        TITLE=ERASE ALL DATA - factory reset, asks to confirm
Cmdline=systemd.factory_reset=1
