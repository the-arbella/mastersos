# 种子分区：安装器把 U 盘上验过的 seed.toml 摆在 /run/mastersos-install/seed（0700 / 0600；没带种子时是空目录），
# repart 建 ext4 时原样拷进去。之后由首次开机的 mastersos-seed-generator 挂到 /var/lib/mastersos-seed。
[Partition]
Type=linux-generic
Label=mastersos-seed
Format=ext4
SizeMinBytes=256M
SizeMaxBytes=256M
CopyFiles=/run/mastersos-install/seed:/
