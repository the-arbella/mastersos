# Golden copy of the signed /usr (usr-self-repair design 4.2). Installer only: the first-boot repart in
# /usr/lib/repart.d does not know about it and factory reset leaves it alone. The custom type UUID keeps it
# invisible to the A/B slots' MatchPartitionType= and to sysupdate.
# Copy of the current usr.
[Partition]
Type=24fb2b7c-2400-4428-b63f-a3b9824db2b7
Label=mastersos-golden-usr
SizeMinBytes=8G
SizeMaxBytes=8G
