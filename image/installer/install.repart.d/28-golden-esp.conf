# Golden copy of the signed /usr (usr-self-repair design 4.2). Installer only: the first-boot repart in
# /usr/lib/repart.d does not know about it and factory reset leaves it alone. The custom type UUID keeps it
# invisible to the A/B slots' MatchPartitionType= and to sysupdate; it is not an ESP type, so firmware and
# bootctl never treat it as a boot partition.
# Holds the current UKI and a manifest; formatted empty here.
[Partition]
Type=b86387b4-5385-488f-ab7b-7d8cc7a663de
Label=mastersos-golden-esp
# Intent: GPT attribute bit 1 (0x2, "No Block IO Protocol") would hide the volume from firmware. It is a no-op today:
# systemd-repart v259 writes 0 for attribute bits 0-2 (PVE, Ventoy T8 MUST 7), so MokManager still lists MOS-GOLDEN. The real
# guard is the FAT label MOS-GOLDEN (set by the installer) and the finish screen's "MASTERSOS (not MOS-GOLDEN)". Linux and
# the initrd find the partition by type UUID either way.
Flags=0x2
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=512M
