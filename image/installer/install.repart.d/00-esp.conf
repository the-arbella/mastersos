# 安装器（mastersos-installer）在内置盘上建的分区，与首次开机的 /usr/lib/repart.d 顺序、类型、标签、大小相同，
# 只是没有 40-root.conf：根分区仍由目标机首次开机时 initrd 里的 repart 建（TPM 登记在目标机自己身上发生）。
# tests/check-tree.sh 第 5 条核对两边一致。镜像里装在 /usr/lib/mastersos/install.repart.d（mkosi.finalize 复制）。
#
# ESP：只格式化，不拷文件——引导程序、主 UKI 与 loader.conf 由 mastersos-installer 从 U 盘的 ESP 复制。
[Partition]
Type=esp
# FAT label of the ESP (repart also uses it as the GPT name). MokManager lists FAT volumes by label: this is the one the
# technician picks under "Enroll key from disk" (the ESP carries mastersos-mok.der at its root).
Label=MASTERSOS
Format=vfat
SizeMinBytes=1G
SizeMaxBytes=1G
