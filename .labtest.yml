# Remote test suites for maintainers. Anyone else: run the same commands locally.
base: master
suites:
  core:
    setup: rustup toolchain install 1.98 --profile minimal -c rustfmt -c clippy
    setup_key: [.labtest.yml, core/rust-toolchain.toml]
    run: cd core && cargo fmt --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --no-fail-fast ${LABTEST_ARGS:---workspace}
    mem: 4.5G
    cpus: 8
    timeout: 30m
    paths: [core/**, image/keys/**]
  card-chrome:
    setup: d=$HOME/.cache/mastersos-card-chrome && rm -rf $d && mkdir -p $d && curl -fsSL -o $d/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && dpkg-deb -x $d/chrome.deb $d/root
    setup_key: [.labtest.yml]
    run: CHROME=$HOME/.cache/mastersos-card-chrome/root/opt/google/chrome/chrome bash image/tests/card-policy-chrome-test.sh
    mem: 1.5G
    cpus: 2
    timeout: 10m
    paths: [image/tests/card-policy-chrome-test.*, image/tests/fixtures/card-policy/**]
  image-tests:
    # Shell and node tests of image/ (CI's image-lint job runs the same scripts). LABTEST_ARGS picks tests by name;
    # "msgfmt" checks every system-i18n catalogue with gettext's msgfmt unpacked by setup. check-tree needs a git
    # index: the synced tree has none, so a throwaway repository is made from it.
    setup: d=$HOME/.cache/mastersos-gettext && rm -rf $d && mkdir -p $d && cd $d && apt-get download gettext && dpkg-deb -x gettext_*.deb root
    setup_key: [.labtest.yml]
    run: >-
      g=$HOME/.cache/mastersos-gettext/root; [ -d .git ] || { git init -q && git add -A && git -c user.name=t -c user.email=t@t commit -qm t; };
      rc=0; for t in ${LABTEST_ARGS:-check-tree user-env-test pam-hooks-test browser-wait-test login-people-test msgfmt}; do
      if [ "$t" = msgfmt ]; then for po in image/system-i18n/*.po; do LD_LIBRARY_PATH=$g/usr/lib/x86_64-linux-gnu $g/usr/bin/msgfmt --check -o /dev/null "$po" || { echo "FAIL msgfmt $po"; rc=1; }; done;
      else bash image/tests/$t.sh || { echo "FAIL $t"; rc=1; }; fi; echo "== $t done"; done; exit $rc
    mem: 1G
    cpus: 4
    timeout: 30m
    paths: [image/**]
