# Remote test suites for maintainers. Anyone else: run the same commands locally.
base: master
suites:
  core:
    setup: rustup toolchain install 1.98 --profile minimal -c rustfmt -c clippy
    setup_key: [.labtest.yml, core/rust-toolchain.toml]
    run: cd core && cargo fmt --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --no-fail-fast ${LABTEST_ARGS:---workspace}
    mem: 4.5G
    cpus: 8
    timeout: 30m
    paths: [core/**, image/keys/**]
  card-chrome:
    setup: d=$HOME/.cache/mastersos-card-chrome && rm -rf $d && mkdir -p $d && curl -fsSL -o $d/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && dpkg-deb -x $d/chrome.deb $d/root
    setup_key: [.labtest.yml]
    run: CHROME=$HOME/.cache/mastersos-card-chrome/root/opt/google/chrome/chrome bash image/tests/card-policy-chrome-test.sh
    mem: 1.5G
    cpus: 2
    timeout: 10m
    paths: [image/tests/card-policy-chrome-test.*, image/tests/fixtures/card-policy/**]
  broker:
    run: bash image/tests/authd-oidc-patch-test.sh
    mem: 2G
    cpus: 4
    timeout: 20m
    paths: [image/patches/authd-oidc/**, image/tests/authd-oidc-patch-test.sh, image/mkosi.build]
  image-tests:
    # Shell and node tests of image/ (CI's image-lint job runs the same scripts). LABTEST_ARGS picks tests by name;
    # "msgfmt" checks every system-i18n catalogue with gettext's msgfmt unpacked by setup. The synced tree has no .git
    # and check-tree reads `git ls-files`, so every test runs in a throwaway repo over a copy.
    setup: d=$HOME/.cache/mastersos-gettext && rm -rf $d && mkdir -p $d && cd $d && apt-get download gettext && dpkg-deb -x gettext_*.deb root
    setup_key: [.labtest.yml]
    run: >-
      g=$HOME/.cache/mastersos-gettext/root; t=$(mktemp -d) && trap 'rm -rf -- "$t"' EXIT && cp -a . "$t" && cd "$t" && git init -q && git add -A || exit 1;
      rc=0; for n in ${LABTEST_ARGS:-check-tree login-people-test user-env-test pam-hooks-test browser-wait-test notice-lib-test msgfmt}; do
      if [ "$n" = msgfmt ]; then for po in image/system-i18n/*.po; do LD_LIBRARY_PATH=$g/usr/lib/x86_64-linux-gnu $g/usr/bin/msgfmt --check -o /dev/null "$po" || { echo "FAIL msgfmt $po"; rc=1; }; done;
      else bash image/tests/$n.sh || { echo "FAIL $n"; rc=1; }; fi; echo "== $n done"; done; exit $rc
    mem: 1G
    cpus: 4
    timeout: 30m
    paths: [image/**, skills/**, tools/**, core/**, .github/**, docs/**]
  e2e-mock:
    # tools/e2e/protocol-v1.sh against the mock server (tools/e2e/mock/run.sh) with our debug binaries; runner only,
    # not in GitHub CI. setup unpacks mawk and gawk (and gawk's libraries) for the script's --self-test under each.
    setup: >-
      rustup toolchain install 1.98 --profile minimal && d=$HOME/.cache/mastersos-e2e-awk && rm -rf $d && mkdir -p $d && cd $d &&
      for p in mawk gawk libmpfr6 libsigsegv2 libgmp10 libreadline8t64; do apt-get download $p || echo "note: no $p"; done;
      for f in *.deb; do [ -e "$f" ] || continue; dpkg-deb -x "$f" root || exit 1; done
    setup_key: [.labtest.yml, core/rust-toolchain.toml]
    # the runner sets CARGO_TARGET_DIR outside the tree: the binaries' folder is resolved while still in core/
    run: >-
      cd core && cargo build --locked --bin mastersos --bin mastersos-agent && t=$(cd "${CARGO_TARGET_DIR:-target}/debug" && pwd -P)
      && cd .. && E2E_AWK_ROOT=$HOME/.cache/mastersos-e2e-awk/root bash tools/e2e/mock/run.sh --bin-dir "$t"
    mem: 4G
    cpus: 8
    timeout: 30m
    paths: [core/**, tools/e2e/**, .labtest.yml]
builds:
  linux-bins:
    setup: rustup toolchain install 1.98 --profile minimal
    setup_key: [.labtest.yml, core/rust-toolchain.toml]
    # the runner sets CARGO_TARGET_DIR outside the tree: copy the binaries to where `artifacts` looks
    run: >-
      cd core && cargo build --locked --release --bin mastersos --bin mastersos-agent
      && t=${CARGO_TARGET_DIR:-target} && mkdir -p target/release
      && { [ "$t/release" -ef target/release ] || cp "$t/release/mastersos" "$t/release/mastersos-agent" target/release/; }
    artifacts: [core/target/release/mastersos, core/target/release/mastersos-agent]
    mem: 6G
    cpus: 8
    timeout: 40m
