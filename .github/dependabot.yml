version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      rust-minor: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
