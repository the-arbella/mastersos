name: mastersos-image
on:
  # By hand only
  workflow_dispatch:
    inputs:
      version:
        description: Image version such as 20261102.1; empty means today plus the run number
        required: false
      snapshot:
        description: Ubuntu snapshot such as 20261102T000000Z; empty means today
        required: false
      beta:
        description: Publish the build to the beta channel of the update source (promote it with mastersos-promote)
        type: boolean
        default: true

permissions:
  contents: write
  # OIDC: the update source's publish role (mastersos-os-ci-publisher in the cloud infra) trusts only the release environment
  id-token: write

concurrency:
  group: mastersos-image
  cancel-in-progress: false

jobs:
  build:
    # The release environment needs the owner's approval and only allows master
    if: github.repository == 'the-arbella/mastersos'
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    env:
      PROFILE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the runner
        run: bash image/ci-runner-setup.sh "$PROFILE"
      - name: Choose the version and the Ubuntu snapshot
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          version=${INPUT_VERSION:-$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER}
          [[ $version =~ ^[0-9]{8}\.[0-9]+$ ]] || { echo "bad version" >&2; exit 1; }
          snapshot=${INPUT_SNAPSHOT:-$(date -u +%Y%m%dT000000Z)}
          [[ $snapshot =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { echo "bad snapshot" >&2; exit 1; }
          {
            echo "VERSION=$version"
            echo "MASTERSOS_SNAPSHOT=$snapshot"
            echo "MASTERSOS_PACKAGE_CACHE=$RUNNER_TEMP/mkosi-packages"
          } >>"$GITHUB_ENV"
      # snapshot.ubuntu.com is often down (5xx, 401). Only the downloaded packages are kept between runs, each checked against
      # the snapshot's signed index before the build (next step); the lists and mkosi.cache are never cached.
      - name: Restore the package cache
        # A cache problem never stops a release build
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mkosi-packages
          key: mkosi-packages-${{ env.MASTERSOS_SNAPSHOT }}-${{ github.run_id }}
          restore-keys: |
            mkosi-packages-${{ env.MASTERSOS_SNAPSHOT }}-
            mkosi-packages-
      - name: Load the release keys
        env:
          MASTERSOS_RELEASE_KEYS_AGE_B64: ${{ secrets.MASTERSOS_RELEASE_KEYS_AGE_B64 }}
          MASTERSOS_AGE_PASSPHRASE: ${{ secrets.MASTERSOS_AGE_PASSPHRASE }}
        run: |
          age_file=$(mktemp -p /dev/shm)
          base64 -d <<<"$MASTERSOS_RELEASE_KEYS_AGE_B64" >"$age_file"
          python3 -I image/ci-load-release-keys.py "$age_file"
          rm -f "$age_file"
      # apt takes a cached .deb whose size matches without checking its hash: keep only packages whose SHA256 is in the
      # snapshot's signed index (gpgv with the Ubuntu archive keyring); when the index cannot be verified, drop them all
      - name: Verify the package cache
        run: python3 -I image/ci-verify-package-cache.py "$MASTERSOS_PACKAGE_CACHE" "$MASTERSOS_SNAPSHOT" "$(sed -n 's/^Release=//p' image/mkosi.conf)"
      - name: Build
        run: |
          # A retry keeps the package cache and only fetches what is missing; wait longer each time for the snapshot host
          for attempt in 1 2 3 4 5; do
            if image/build.sh "$VERSION"; then exit 0; fi
            echo "::warning::build attempt $attempt failed"
            sleep $((attempt * 180))
          done
          exit 1
      # mkosi runs as root and apt keeps a 0700 archives/partial (half-downloaded files) in the cache: the runner user's
      # tar cannot read it, so the save failed on every run until 2026-11-06 and every build downloaded ~1.5 GB again.
      # Drop the partial downloads and hand the rest to the runner user.
      - name: Make the package cache readable
        if: always()
        continue-on-error: true
        run: |
          [ -d "$MASTERSOS_PACKAGE_CACHE" ] || exit 0
          sudo find "$MASTERSOS_PACKAGE_CACHE" -type d -name partial -prune -exec rm -rf {} +
          sudo chown -R "$(id -u):$(id -g)" "$MASTERSOS_PACKAGE_CACHE"
          du -sh "$MASTERSOS_PACKAGE_CACHE"
      # Saved even when the build failed: the next run then only fetches what is still missing
      - name: Save the package cache
        if: always()
        # A cache problem never stops a release build
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mkosi-packages
          key: mkosi-packages-${{ env.MASTERSOS_SNAPSHOT }}-${{ github.run_id }}
      - name: Scan the output for private keys
        id: leak_scan
        if: always()
        run: python3 -I image/key-leak-check.py /run/mastersos-release-keys image/mkosi.output
      # A release asset is at most 2 GiB; a bigger file goes up in parts, `cat <file>.part-* > <file>` restores it
      - name: Publish to a GitHub Release
        if: steps.leak_scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=image/mkosi.output/$VERSION
          assets=$(mktemp -d)
          cp "$out"/build-info.txt "$assets/"
          for f in "$out"/MastersOS-*.zip "$out"/MastersOS-*.img.zst; do
            [ -e "$f" ] || continue
            if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
              split -b 1900M -d "$f" "$assets/$(basename "$f").part-"
            else
              cp "$f" "$assets/"
            fi
          done
          (cd "$assets" && sha256sum -- * >SHA256SUMS)
          # signed with the update source's key: mastersos-promote publishes these assets to installer/ only if it verifies
          image/ci-publish.sh sign-release "$VERSION" "$assets"
          gh release create "image-$PROFILE-$VERSION" "$assets"/* --prerelease --target "$GITHUB_SHA" \
            --title "MastersOS $VERSION ($PROFILE)" --notes "Commit $GITHUB_SHA, run $GITHUB_RUN_ID."
      - name: AWS credentials for the update source
        if: steps.leak_scan.outcome == 'success' && inputs.beta
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.MASTERSOS_OS_PUBLISH_ROLE }}
          aws-region: ap-southeast-1
          role-duration-seconds: 7200
      # docs/update-channels.md "Publishing from CI": machines on beta pick it up; mastersos-promote moves it to stable
      - name: Publish to the beta channel
        if: steps.leak_scan.outcome == 'success' && inputs.beta
        env:
          MASTERSOS_OS_BUCKET: ${{ secrets.MASTERSOS_OS_BUCKET }}
          MASTERSOS_OS_CDN: ${{ secrets.MASTERSOS_OS_CDN }}
        run: image/ci-publish.sh beta "$VERSION"
      - name: Wipe the release keys
        if: always()
        run: image/keys-unload.sh
      - name: Keep the build record
        if: always() && steps.leak_scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mastersos-image-record
          retention-days: 14
          if-no-files-found: warn
          path: |
            image/mkosi.output/build-*.log
            image/mkosi.output/*/build-info.txt
            image/mkosi.output/*/*.manifest
