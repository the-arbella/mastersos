name: cli-release
# The command lines school IT installs (mastersos, mastersos-sign) for macOS, Linux and Windows
# (spec 2026-11-04 §5.5). Every run builds all targets and installs them on each OS from a release served on
# the runner; only a manual run with `publish` ticked creates the tag cli-<12-char commit> and the GitHub release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        type: string
      publish:
        description: Create the tag cli-<commit> and the GitHub release
        required: false
        type: boolean
        default: false
  # Changes to this workflow or the install scripts get a build and install check before they reach master
  push:
    branches-ignore: ["master", "dependabot/**"]
    paths:
      - .github/workflows/cli-release.yml
      - tools/install/**

permissions:
  contents: read

concurrency:
  group: cli-release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

# Git settings as environment for every checkout (see cli-tests in mastersos.yml): image/ has paths NTFS cannot
# hold, and nothing is converted to CRLF
env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: core.protectNTFS
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: core.autocrlf
  GIT_CONFIG_VALUE_1: "false"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          sparse-checkout: tools/install
      - id: sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "tag=cli-${sha:0:12}" >>"$GITHUB_OUTPUT"
          echo "Building $sha as cli-${sha:0:12}"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, tool: cargo }
          - { target: x86_64-apple-darwin, os: macos-latest, tool: cargo }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, tool: cross }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, tool: cross }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, tool: cargo }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            core
            skills
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      # The musl builds need a C cross toolchain for ring: cross's images (core/Cross.toml), same version as the tag there
      - if: matrix.tool == 'cross'
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          TOOL: ${{ matrix.tool }}
        run: $TOOL build --locked --release --target "$TARGET" -p mastersos-mcp -p mastersos-sign
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p ../dist
          out=target/$TARGET/release
          if [[ $TARGET == *windows* ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$out/mastersos.exe', '$out/mastersos-sign.exe' -DestinationPath '../dist/mastersos-$TARGET.zip'"
          else
            tar -czf "../dist/mastersos-$TARGET.tar.gz" -C "$out" mastersos mastersos-sign
          fi
          ls -l ../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # One set of assets and sums: the install checks and the release use exactly these files
  sums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - run: |
          cd release
          [ "$(find . -type f | wc -l)" -eq 5 ] || { ls -l; echo "expected 5 assets" >&2; exit 1; }
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
      # Every binary is for the target its asset names, including the ones no install check runs
      # (x86_64-apple-darwin, aarch64-unknown-linux-musl)
      - name: Check each binary's architecture
        run: |
          check() { # <asset> <file pattern>
            local dir
            dir=$(mktemp -d)
            case $1 in
              *.zip) unzip -q "release/$1" -d "$dir" ;;
              *) tar -xzf "release/$1" -C "$dir" ;;
            esac
            for bin in "$dir"/*; do
              desc=$(file -b "$bin")
              echo "$1 $(basename "$bin"): $desc"
              [[ $desc =~ $2 ]] || { echo "::error::$1: $(basename "$bin") is not $2"; exit 1; }
            done
            [ "$(find "$dir" -type f | wc -l)" -eq 2 ] || { echo "::error::$1 does not hold exactly two programs"; exit 1; }
          }
          check mastersos-aarch64-apple-darwin.tar.gz '^Mach-O 64-bit arm64 executable'
          check mastersos-x86_64-apple-darwin.tar.gz '^Mach-O 64-bit x86_64 executable'
          check mastersos-x86_64-unknown-linux-musl.tar.gz '^ELF 64-bit LSB .*x86-64.*(statically linked|static-pie linked)'
          check mastersos-aarch64-unknown-linux-musl.tar.gz '^ELF 64-bit LSB .*ARM aarch64.*(statically linked|static-pie linked)'
          check mastersos-x86_64-pc-windows-msvc.zip '^PE32\+ executable.*x86-64'
          echo "all five assets hold binaries for their targets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  # install.sh / install.ps1 against the real assets, served as a release on the runner (MASTERSOS_RELEASE_BASE):
  # the installed mastersos --version runs, and a tampered SHA256SUMS installs nothing
  install-check:
    needs: [meta, sums]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
          sparse-checkout: tools/install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - if: runner.os != 'Windows'
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          MASTERSOS_INSTALL_TEST_REQUIRE_SHELLCHECK: ${{ runner.os == 'Linux' && '1' || '' }}
        run: bash tools/install/test-install.sh "$PWD/release" "$TAG"
      - if: runner.os == 'Windows'
        shell: powershell
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\install\test-install.ps1 -ReleaseDir "$PWD\release" -Tag $env:TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    needs: [meta, install-check]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'the-arbella/mastersos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.meta.outputs.sha }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          # Releases come only from master: the commit must be master itself or behind it
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$SHA" --jq .status)
          case $status in
            identical | behind) echo "$SHA is on master ($status)" ;;
            *)
              echo "::error::$SHA is not on master (compare says: $status). Releases are published only from commits on master; merge first, then run this again with that commit"
              exit 1
              ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" \
            --notes "MastersOS command line (mastersos, mastersos-sign) built from commit $SHA, run $GITHUB_RUN_ID. Install: tools/install/install.sh or install.ps1."
